pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
        maven { url "https://jitpack.io" }
    }
}

rootProject.name = "XIME"

include ':XIME.UI'
include ':XIME.Core'
include ':XIME.Media'
include ':XIME.Performance'
include ':XIME.Animation'
include ':XIME.Persistence'
include ':XIME.Haptic'
include ':XIME.Graphics'
include ':XIME.Tools'
include ':XIME.Imaging'
include ':XIME.Terminal'
include ':XIME.AI'
include ':XIME.Location'
include ':XIME.Net'
