[versions]
agp = "9.2.1"
coil = "2.7.0"
fastadapterExtensionsDiff = "5.7.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
kotlinxCoroutinesAndroid = "1.11.0"
localbroadcastmanager = "1.1.0"
lottie = "6.7.1"
material = "1.14.0"
chaquopy = "17.0.0"
okhttpVersion = "5.4.0"
pagingRxjava3 = "3.5.0"
pythonAndroid = "17.0.0"
room = "2.8.4"
lifecycle = "2.11.0"
recyclerview = "1.4.0"
media3 = "1.10.1"
media = "1.8.0"
glide = "5.0.9"
activity = "1.13.0"
fragment = "1.8.9"
coreSplashscreen = "1.2.0"
gson = "2.14.0"
navigation = "2.9.8"
commonsCompress = "1.28.0"
dynamicAnimation = "1.1.0"
palette = "1.0.0"
coordinatorlayout = "1.3.0"
constraintlayout = "2.2.1"
preference = "1.2.1"
rxandroid = "3.0.2"
rxjava = "3.1.12"
startupRuntime = "1.2.0"
tensorflowLite = "2.17.0"
workRxjava3 = "2.11.2"
zxing = "3.5.4"
zxing-android-embedded = "4.3.0"
okhttp = "5.4.0"
spline = "0.2.4"
annotation = "1.10.0"

[libraries]
androidx-localbroadcastmanager = { module = "androidx.localbroadcastmanager:localbroadcastmanager", version.ref = "localbroadcastmanager" }
androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "pagingRxjava3" }
androidx-paging-rxjava3 = { module = "androidx.paging:paging-rxjava3", version.ref = "pagingRxjava3" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startupRuntime" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "workRxjava3" }
androidx-work-rxjava3 = { module = "androidx.work:work-rxjava3", version.ref = "workRxjava3" }
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coil" }
coil-video = { module = "io.coil-kt:coil-video", version.ref = "coil" }
fastadapter = { module = "com.mikepenz:fastadapter", version.ref = "fastadapterExtensionsDiff" }
fastadapter-extensions1-binding = { module = "com.mikepenz:fastadapter-extensions-binding", version.ref = "fastadapterExtensionsDiff" }
fastadapter-extensions1-diff = { module = "com.mikepenz:fastadapter-extensions-diff", version.ref = "fastadapterExtensionsDiff" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
kotlinx-coroutines-rx3 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-rx3", version.ref = "kotlinxCoroutinesAndroid" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Room database
okhttp-v540 = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttpVersion" }
okhttp3-integration = { module = "com.github.bumptech.glide:okhttp3-integration", version.ref = "glide" }
python-android = { module = "com.chaquo.python:python-android", version.ref = "pythonAndroid" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# ViewModel and LiveData
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }

# RecyclerView and Layouts
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
coordinatorlayout = { group = "androidx.coordinatorlayout", name = "coordinatorlayout", version.ref = "coordinatorlayout" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# Media3 for audio playback
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# Media for notifications
androidx-media = { group = "androidx.media", name = "media", version.ref = "media" }

# Image loading
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }

# JSON parsing
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Activity and Fragment
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigation" }
navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# Other Utils
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
dynamic-animation = { group = "androidx.dynamicanimation", name = "dynamicanimation", version.ref = "dynamicAnimation" }
palette = { group = "androidx.palette", name = "palette", version.ref = "palette" }
preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
rxandroid = { module = "io.reactivex.rxjava3:rxandroid", version.ref = "rxandroid" }
rxjava = { module = "io.reactivex.rxjava3:rxjava", version.ref = "rxjava" }
tensorflow-lite = { module = "org.tensorflow:tensorflow-lite", version.ref = "tensorflowLite" }
tensorflow-lite-gpu = { module = "org.tensorflow:tensorflow-lite-gpu", version.ref = "tensorflowLite" }
zxing = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxing-android-embedded" }
spline-runtime = { group = "design.spline", name = "spline-runtime", version.ref = "spline" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
chaquopy = { id = "com.chaquo.python", version.ref = "chaquopy" }
navigation-safeargs = { id = "androidx.navigation.safeargs", version.ref = "navigation" }
